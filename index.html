<!doctype html>
<html lang="en-ZA" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Page-specific SEO tags are generated from src/lib/seo-routes.ts (see vite-plugin-seo.ts) -->
    <!--seo-->
    <title>Capvtal Innovations</title>
    <!--/seo-->
    <!--site-schema-->

    <meta name="author" content="Capvtal Innovations" />
    <meta name="application-name" content="Capvtal Innovations" />
    <meta name="apple-mobile-web-app-title" content="Capvtal" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f5f5f7" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Apply the saved theme before first paint (no flash). Light is the default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          var r = document.documentElement;
          r.classList.remove("dark", "light");
          r.classList.add(t);
          if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#070709");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
